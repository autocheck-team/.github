name: Баг
description: Что-то работает не так
labels: [bug]
projects: ["autocheck-team/1"]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи, скриншоты
      render: text
